name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Найти проект (подходит и ChessOverlay.zip, загруженный в корень репозитория)
        run: |
          if [ -f ChessOverlay.zip ]; then mkdir -p _src && unzip -q -o ChessOverlay.zip -d _src; fi
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          [ -n "$S" ] || { echo "settings.gradle не найден"; exit 1; }
          echo "ROOT=$(cd "$(dirname "$S")" && pwd)" >> "$GITHUB_ENV"

      - name: Установить Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Собрать Stockfish для Android arm64 (если не получится — приложение использует встроенный движок)
        continue-on-error: true
        run: |
          set -e
          TAG=$(git ls-remote --tags --refs https://github.com/official-stockfish/Stockfish.git 'sf_*' | sed 's#.*refs/tags/##' | grep -E '^sf_[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
          echo "Stockfish: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/official-stockfish/Stockfish.git /tmp/sf
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/sf/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          mkdir -p "$ROOT/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$ROOT/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          ls -la "$ROOT/app/src/main/jniLibs/arm64-v8a"

      - name: Собрать APK
        working-directory: ${{ env.ROOT }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
